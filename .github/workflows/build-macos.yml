name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile the Apple Silicon app
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show selected Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build without distribution signing
        run: |
          xcodebuild \
            -project VirtualDisplayCamera.xcodeproj \
            -scheme VirtualDisplayCamera \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/VirtualDisplayCameraBuild" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
